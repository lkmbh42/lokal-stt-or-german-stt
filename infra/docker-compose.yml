# Variant B — multi-user team server stack.
#
#   cp .env.example .env   # then set STT_SECRET_KEY + passwords
#   docker compose up --build
#
# Air-gap deployment: build the image on a connected machine, `docker save` /
# `docker load` it across, and stage model weights into the `models` volume
# (engine/scripts/download_model.py). Nothing here reaches the internet at
# runtime. TLS termination lands in Phase 3 — until then this listens on
# plain HTTP and must stay on a trusted network.

name: lokal-stt

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${STT_HTTP_PORT:-8080}:80"
      # TLS (see nginx/tls.conf.example): publish 443 and mount certs
      # - "${STT_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # built frontend: run `npm run build` in apps/server/frontend first
      - ../apps/server/frontend/dist:/usr/share/nginx/html:ro
      # - ./tls:/etc/nginx/tls:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    env_file: .env
    environment:
      STT_DATABASE_URL: postgresql+psycopg://stt:${POSTGRES_PASSWORD}@postgres:5432/stt
      STT_REDIS_URL: redis://redis:6379/0
    volumes:
      - stt-data:/data
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    command: >
      celery -A server_app.tasks worker
      --loglevel=info
      --concurrency=${STT_MAX_CONCURRENT_JOBS:-1}
    env_file: .env
    environment:
      STT_DATABASE_URL: postgresql+psycopg://stt:${POSTGRES_PASSWORD}@postgres:5432/stt
      STT_REDIS_URL: redis://redis:6379/0
    volumes:
      - stt-data:/data
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # GPU worker: install nvidia-container-toolkit on the host, then enable:
    # gpus: all
    # and set STT_ENGINE__DEVICE=cuda in .env. Worker --concurrency must fit
    # VRAM: large-v3 float16 ≈ 4.7 GB per concurrent job.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stt
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stt -d stt"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  stt-data:
  pg-data:
