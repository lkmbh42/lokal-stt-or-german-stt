# Reverse proxy for the team server.
# TLS termination (internal CA / self-signed) is added in Phase 3 — this
# plain-HTTP config is for trusted internal networks only.

upstream stt_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # uploads up to the API's own limit; the API still enforces server-side
    client_max_body_size 512m;

    # In Phase 3 the built multi-user frontend is served from here;
    # for now everything proxies to the API.
    location / {
        proxy_pass http://stt_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # WebSocket upgrade (live transcription lands in the Phase 3 frontend)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}
