# Reverse proxy + static frontend for the team server (plain HTTP).
#
# TLS: copy tls.conf.example over this file (or add it alongside with the
# HTTP block reduced to a redirect), generate certs with
# tls/generate-self-signed.sh, and mount ./tls into the container — see
# infra/README.md. Plain HTTP is acceptable only on trusted internal
# networks.

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream stt_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # security headers (Phase 4 pass)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    client_max_body_size 512m;

    # built multi-user frontend (apps/server/frontend/dist, mounted ro)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://stt_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
