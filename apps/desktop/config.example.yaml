# Desktop app configuration — copy to config.yaml and adjust.
# All keys optional; values shown are defaults unless noted.

# Loopback only. Anything else is rejected at startup (use Variant B for teams).
host: 127.0.0.1
port: 8710

# Job database, uploaded audio and transcripts live here.
data_dir: data

max_upload_mb: 500

# ACCURATE model: used for batch uploads and for the full-quality
# re-transcription of saved recordings. Same schema as
# engine/config.example.yaml.
engine:
  model: large-v3            # best accuracy; large-v3-turbo = near-equal
                             # accuracy at ~4x the speed (recommended on CPU)
  device: auto               # auto | cuda | cpu
  compute_type: auto
  # PRODUCTION / AIR-GAP:
  # model: ./models/faster-whisper-large-v3
  # local_files_only: true
  vad:
    enabled: true
    threshold: 0.5

# OPTIONAL second, faster model for the LIVE preview while recording.
# Recommended on CPU-only machines: keeps partial text responsive while the
# accurate model above still produces the final transcript. Remove/comment
# out to run live on the main model (fine on GPU hardware).
# live_engine:
#   model: base

# Live microphone transcription tuning.
live:
  tick_seconds: 3.0          # partial-update cadence (lower = snappier, more CPU)
  beam_size: 1               # raise to 5 on GPU hardware for better partials
  silence_commit_seconds: 0.8
  max_pending_seconds: 30.0
