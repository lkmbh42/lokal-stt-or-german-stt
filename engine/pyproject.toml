[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "german-stt-engine"
version = "0.1.0"
description = "Local, offline German speech-to-text engine (faster-whisper + Silero VAD)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "faster-whisper>=1.1.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-docx>=1.1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
stt-transcribe = "engine.transcribe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: requires ASR model weights (downloads a small model on first run; excluded from offline unit runs)",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# faster-whisper / ctranslate2 ship no py.typed marker
disable_error_code = ["import-untyped"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# embedded PowerShell here-strings can't be wrapped
"scripts/make_fixtures.py" = ["E501"]
"scripts/benchmark.py" = ["E501"]
